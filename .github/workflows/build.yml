name: Build Windows app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MdLight.sln

      - name: Build
        run: dotnet build MdLight.sln -c Release --no-restore

      - name: Smoke test
        run: src\MdLight\bin\Release\net48\MdLight.exe --smoke-test

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          New-Item -ItemType Directory -Path portable -Force
          Copy-Item src/MdLight/bin/Release/net48/MdLight.exe portable/
          Copy-Item README.md, README.ru.md, LICENSE, sample.md, sample.ru.md portable/
          Compress-Archive -Path portable/* -DestinationPath dist/MdLight-portable.zip

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found" }
          & $iscc installer\MdLight.iss

      - name: Installer smoke test
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath dist/MdLight-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="associate_md"' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)" }
          $smoke = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\MdLight\MdLight.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed app smoke test failed" }
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Classes\.md')
          $association = $key.GetValue('')
          $contentType = $key.GetValue('Content Type')
          $perceivedType = $key.GetValue('PerceivedType')
          $key.Dispose()
          if ($association -ne 'MdLight.Markdown') { throw "File association was not registered" }
          if ($contentType -ne 'text/markdown') { throw "Markdown content type was not registered" }
          if ($perceivedType -ne 'text') { throw "Markdown perceived type was not registered" }
          $previewCategory = '{8895B1C6-B41F-4C1C-A562-0D564250836F}'
          $textPreviewHandler = '{1531D583-8375-4D3F-B5FB-D23BBD169F22}'
          foreach ($extension in '.md', '.markdown') {
            $previewKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey("Software\Classes\$extension\shellex\$previewCategory")
            if (-not $previewKey) { throw "Preview handler was not registered for $extension" }
            $previewHandler = $previewKey.GetValue('')
            $previewKey.Dispose()
            if ($previewHandler -ne $textPreviewHandler) { throw "Unexpected preview handler for $extension" }
          }
          $uninstall = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\MdLight\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)" }
          foreach ($extension in '.md', '.markdown') {
            $previewPath = "Software\Classes\$extension\shellex\$previewCategory"
            if ([Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($previewPath)) { throw "Preview handler registration remains after uninstall for $extension" }
          }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: MdLight-windows
          path: |
            dist/MdLight-Setup.exe
            dist/MdLight-portable.zip
          if-no-files-found: error
